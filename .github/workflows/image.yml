# Never a Dockerfile nobody ran: on every PR and on main, build the image, run it as Coolify does, wait for its own
# health check, and run server/check.sh against it. On failure, the container's logs and health log are printed.
name: image
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Put what Coolify writes into the build context there too (30 Oct, its docker-compose.yaml answered 200)
        run: |
          printf 'services: {}\n' > docker-compose.yaml; printf 'RESEND_API_KEY=decoy\n' > .env; printf 'X=1\n' > .env.production
          mkdir -p .nixpacks docs tests; touch .nixpacks/plan.json docs/notes.md tests/x.sh
      - name: Build the image
        run: docker build -t justech-site .
      - name: The image holds the site and its server, nothing else
        run: |
          leaks=$(docker run --rm --entrypoint sh justech-site -c 'find /srv \( -name "docker-compose*" -o -name ".env*" -o -name ".git*" -o -name .nixpacks -o -name docs -o -name tests -o -name Dockerfile -o -name .dockerignore -o -name README.md -o -name check.sh \)')
          [ -z "$leaks" ] || { echo "in the image:"; echo "$leaks"; exit 1; }
          docker run --rm --entrypoint sh justech-site -c 'ls -A /srv /srv/site'
      - name: Run it (as Coolify does, with its predefined variables)
        run: docker run -d --name site -p 8080:8080 -e HOST=0.0.0.0 -e PORT=8080 -e COOLIFY_FQDN=justech.uk justech-site
      - name: Wait for the image's own health check
        run: |
          for i in $(seq 1 45); do
            running=$(docker inspect -f '{{.State.Running}}' site); health=$(docker inspect -f '{{.State.Health.Status}}' site)
            echo "$i running=$running health=$health"
            [ "$health" = healthy ] && exit 0
            [ "$running" = false ] && { echo "the container exited"; exit 1; }
            sleep 2
          done
          echo "not healthy after 90 s"; exit 1
      - name: The health check from inside, as Coolify runs it
        run: docker exec site wget -qO- http://127.0.0.1:8080/healthz
      - name: The site's checks
        run: sh server/check.sh http://127.0.0.1:8080 503
      - name: Again with a stray PORT (an app's old variables stay in Coolify when its build pack changes)
        run: |
          docker run -d --name site80 -p 8081:8080 -e PORT=80 justech-site
          for i in $(seq 1 45); do
            running=$(docker inspect -f '{{.State.Running}}' site80); health=$(docker inspect -f '{{.State.Health.Status}}' site80)
            echo "$i running=$running health=$health"
            [ "$health" = healthy ] && { sh server/check.sh http://127.0.0.1:8081 503; exit $?; }
            [ "$running" = false ] && { echo "the container exited"; docker logs site80; exit 1; }
            sleep 2
          done
          echo "not healthy after 90 s"; docker logs site80; docker inspect -f '{{json .State.Health}}' site80; exit 1
      - name: On failure, the container's logs and health log
        if: failure()
        run: |
          docker ps -a
          docker logs site || true
          docker inspect -f '{{json .State.Health}}' site || true
          docker exec site sh -c 'id; ls -la /srv /srv/site | head -40; env | sort' || true
