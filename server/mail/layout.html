<!doctype html>
<!-- JusTech mail, the layout (round 20). Shared: the site's contact mail uses it, and JustApp copies it (D-53) for its
     own notices. Tables and inline styles, because mail clients ignore most CSS; light only, so no client inverts it.
     A name in double braces is escaped when filled, in triple braces it is HTML already made safe (mail.mjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f1f7;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f1f7;">
<tr><td align="center" style="padding:28px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
    <tr><td style="background:#17141d;border-radius:14px 14px 0 0;padding:20px 28px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="vertical-align:middle;"><img src="{{mark_url}}" width="32" height="32" alt="" style="display:block;border:0;border-radius:7px;"></td>
        <td style="vertical-align:middle;padding-left:12px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#f1edf7;">Jus<span style="color:#d0b2ff;">T</span>ech</td>
      </tr></table>
    </td></tr>
    <tr><td style="background:#6231ba;height:3px;line-height:3px;font-size:0;">&nbsp;</td></tr>
    <tr><td style="background:#ffffff;padding:30px 28px 26px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#17141d;">
      <p style="margin:0 0 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.3px;color:#6231ba;">{{kicker}}</p>
      <h1 style="margin:0 0 20px;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-0.4px;color:#17141d;">{{title}}</h1>
      {{{content}}}
    </td></tr>
    <tr><td style="background:#ffffff;border-radius:0 0 14px 14px;border-top:1px solid #ebe7f2;padding:16px 28px 22px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.5;color:#7a7289;">{{footer}}<br>JusTech · Zagreb, Croatia · <a href="https://justech.uk" style="color:#6231ba;text-decoration:none;">justech.uk</a></td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
